<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSoto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradSoto)" rx="24" />
  <rect x="30" y="25" width="340" height="250" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" filter="drop-shadow(0px 8px 16px rgba(44, 57, 104, 0.08))" />
  
  <!-- Rice -->
  <rect x="50" y="45" width="140" height="110" rx="16" fill="url(#plateGrad)" stroke="#E2E8F0" stroke-width="2" />
  <circle cx="120" cy="100" r="32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  <text x="120" y="104" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2C3968" text-anchor="middle">Nasi Putih</text>

  <!-- Soto / Soup Bowl -->
  <rect x="205" y="45" width="145" height="110" rx="16" fill="url(#plateGrad)" stroke="#F59E0B" stroke-width="2" />
  <circle cx="278" cy="95" r="34" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" />
  <circle cx="265" cy="90" r="8" fill="#FFFFFF" stroke="#F59E0B" />
  <circle cx="265" cy="90" r="5" fill="#F59E0B" />
  <text x="278" y="138" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#D97706" text-anchor="middle">Soto Bening / Sup</text>

  <!-- Veggie -->
  <rect x="50" y="170" width="140" height="90" rx="16" fill="url(#plateGrad)" stroke="#10B981" stroke-width="2" />
  <circle cx="90" cy="215" r="20" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
  <text x="135" y="218" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#2C3968">Sayur Bening</text>

  <!-- Fruit & Milk -->
  <rect x="205" y="170" width="145" height="90" rx="16" fill="url(#plateGrad)" stroke="#E2E8F0" stroke-width="2" />
  <rect x="220" y="185" width="28" height="42" rx="4" fill="#35CBC3" />
  <text x="234" y="210" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SUSU</text>
  <circle cx="285" cy="205" r="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
  <text x="285" y="209" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#B45309" text-anchor="middle">Pisang</text>

  <rect x="135" y="15" width="130" height="20" rx="10" fill="#2C3968" />
  <text x="200" y="29" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#A7F3D0" text-anchor="middle">MBG 5 Bintang • Kuah</text>
</svg>
